  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to GSTSyncPro</title>
  <meta name="rating" content="General">
  <meta name="classification" content="Business &amp; Finance, Tax Software, Chrome Extensions">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- Modern Premium Typography -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0b0f19;
      --card: rgba(20, 26, 46, 0.6);
      --border: rgba(255, 255, 255, 0.08);
      --blue: #2563eb;
      --cyan: #06b6d4;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --green: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(6, 182, 212, 0.12) 0%, transparent 45%);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 20px;
    }

    /* Glassmorphism Card Container */
    .welcome-card {
      background: var(--card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 32px;
      width: 100%;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .icon-wrapper {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 0 auto 28px;
    }

    .pulse-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: rgba(37, 99, 235, 0.2);
      animation: pulse 2s infinite;
    }

    .logo-badge {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 32px;
    }

    h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 30%, var(--text-muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    p {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 32px;
      font-weight: 300;
    }

    /* Sync Indicator States */
    .sync-status {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px 20px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      transition: all 0.4s ease;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--blue);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--blue);
      animation: blink 1.5s infinite;
    }

    .status-text {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }

    /* Completed state */
    .sync-status.completed {
      background: rgba(16, 185, 129, 0.08);
      border-color: rgba(16, 185, 129, 0.25);
    }
    .sync-status.completed .status-dot {
      background-color: var(--green);
      box-shadow: 0 0 10px var(--green);
      animation: none;
    }

    .footer-note {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.35);
      margin-top: 24px;
    }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    @keyframes blink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>

  <div class="welcome-card">
    <div class="icon-wrapper">
      <div class="pulse-ring"></div>
      <div class="logo-badge">⚡</div>
    </div>

    <h1>GSTSync Pro Activated</h1>
    <p>Thank you for installing GSTR-2B &amp; IMS Reconciler. We are checking and restoring your license configuration.</p>

    <div class="sync-status" id="statusContainer">
      <div class="status-dot"></div>
      <div class="status-text" id="statusText">Syncing license signature...</div>
    </div>

    <div class="footer-note">
      You can close this tab once the sync is completed.
    </div>
  </div>

  <!-- Secure Synchronization Script -->
  <script>
    (function () {
      var urlParams = new URLSearchParams(window.location.search);
      var extId = urlParams.get('extId');

      if (extId) {
        // Read deviceId from persistent Web LocalStorage
        var deviceId = localStorage.getItem('gstsync_device_id');
        
        if (!deviceId) {
          // First install: Generate new Device ID
          deviceId = 'DEV-' + generateRandomString(8) + generateRandomString(8);
          localStorage.setItem('gstsync_device_id', deviceId);
        }
        
        // Securely message the chrome extension
        if (typeof chrome !== 'undefined' && chrome.runtime && typeof chrome.runtime.sendMessage === 'function') {
          chrome.runtime.sendMessage(extId, {
            type: 'RESTORE_DEVICE_ID',
            deviceId: deviceId
          }, function (response) {
            if (chrome.runtime.lastError) {
              console.warn('[Sync] Extension offline:', chrome.runtime.lastError.message);
              updateUIStatus("Sync failed. Please open the extension manually.", false);
            } else {
              console.info('[Sync] Restored Device ID:', response);
              updateUIStatus("Sync successful! You can close this tab.", true);
            }
          });
        } else {
          // Fallback if chrome API is not detected immediately
          setTimeout(function() {
            window.location.reload();
          }, 1500);
        }
      } else {
        updateUIStatus("GSTSync Pro is active on your device.", true);
      }

      function updateUIStatus(text, isComplete) {
        var statusContainer = document.getElementById('statusContainer');
        var statusText = document.getElementById('statusText');
        
        if (statusText) statusText.textContent = text;
        if (isComplete && statusContainer) {
          statusContainer.classList.add('completed');
        }
      }

      function generateRandomString(length) {
        var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        var result = '';
        for (var i = 0; i < length; i++) {
          result += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        return result;
      }
    })();
  </script>
